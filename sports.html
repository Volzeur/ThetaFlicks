<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThetaFlicks Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>
    <style>
        :root {
            --bg-base: #0f1218;
            --bg-surface: #1a1e2a;
            --bg-card: #1e2330;
            --bg-elevated: #242837;
            --accent: #285761;
            --accent-2: #39cccc;
            --accent-glow: rgba(79, 195, 247, 0.18);
            --text-primary: #D7D7D7;
            --text-secondary: #E0E0E0;
            --text-muted: #39cccc;
            --border: rgba(79, 195, 247, 0.12);
            --header-h: 70px;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Lexend', sans-serif;
            overflow-x: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 50%, rgba(79,195,247,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(79,195,247,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #285661; border-radius: 10px; }

        /* HEADER */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--header-h);
            background: linear-gradient(to bottom, rgba(15,18,24,0.98) 100%, transparent);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        header .logo img { width: 170px; height: auto; }

        #back-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid var(--border);
            border-radius: 50px;
            color: var(--text-secondary);
            font-family: 'Lexend', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 7px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #back-btn:hover { border-color: var(--accent-2); color: var(--accent-2); background: var(--accent-glow); }

        #searchFunc {
            width: 100%;
            margin-left: auto;
            background: #17252e;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            color: var(--text-primary);
            font-family: 'Lexend', sans-serif;
            font-size: 0.88rem;
            padding: 8px 20px 8px 40px;
            outline: none;
            transition: border-color 0.2s, width 0.3s, box-shadow 0.2s;
        }
        #searchFunc:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(57,204,204,0.12);
        }
        #searchFunc::placeholder { color: var(--text-muted); }

        .search-wrap {
            width: 100%;
            margin-left: auto;
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* MAIN */
        .container {
            padding-top: calc(var(--header-h) + 36px);
            padding-left: 40px;
            padding-right: 40px;
            padding-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        /* PAGE TITLE */
        .page-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 24px;
        }
        .page-title i { color: var(--accent-2); font-size: 1.15rem; }

        /* CONTROLS / CHIPS */
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }


        .sport-btn {
            padding: 7px 16px;
            border-radius: 50px;
            font-size: 0.80rem;
            font-weight: 700;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Lexend', sans-serif;
        }
        .sport-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
        .sport-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* MATCHES GRID */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        /* MATCH CARD */
        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: transform 0.22s, box-shadow 0.22s, border-color 0.2s;
            cursor: default;
        }
        .match-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(57,204,204,0.2);
            border-color: rgba(57,204,204,0.25);
        }

        .match-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-elevated);
            overflow: hidden;
            position: relative;
        }
        .match-thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }
        .match-card:hover .match-thumb img { transform: scale(1.03); }

        .fake-thumb {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-elevated) 0%, #0d1520 100%);
            padding: 16px;
            gap: 4px;
        }
        .fake-thumb .ft-icon { font-size: 2.2rem; margin-bottom: 8px; opacity: 0.7; }
        .fake-thumb .team-name { font-size: 0.95rem; font-weight: 700; color: #fff; line-height: 1.2; }
        .fake-thumb .vs { font-size: 0.78rem; font-weight: 700; color: var(--accent-2); letter-spacing: 2px; text-transform: uppercase; margin: 4px 0; }

        .thumb-spinner {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(13,18,32,0.5);
            z-index: 2;
        }
        .thumb-spinner .spinner { width: 2rem; height: 2rem; margin: 0; }

        .live-badge {
            position: absolute;
            top: 10px; left: 10px;
            background: #ef5350;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-badge::before {
            content: '';
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: livePulse 1.2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        .match-content { padding: 14px 16px; }

        .match-time {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-2);
            margin-bottom: 8px;
        }

        .match-teams {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .streams { display: flex; gap: 8px; flex-wrap: wrap; }

        .stream-link {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-family: 'Lexend', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .stream-link:hover { background: var(--accent-2); color: #0f1218; transform: scale(1.04); }

        .no-streams { font-size: 0.78rem; color: rgba(255,255,255,0.3); font-style: italic; }

        /* LOADING / EMPTY */
        .loading {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }
        .loading p { color: var(--text-muted); font-size: 0.9rem; margin-top: 16px; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.3);
        }
        .empty-state p:first-child { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
        .empty-state p:last-child { font-size: 0.85rem; }

        /* SPINNER */
        .spinner {
            width: 3rem; height: 3rem;
            border: 5px solid rgba(79,195,247,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* STREAM MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }

        .modal-box {
            position: relative;
            z-index: 1;
            background: #0a0c14;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            animation: modalIn 0.22s ease;
            box-shadow: 0 32px 80px rgba(0,0,0,0.8);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .modal-close {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .modal-close:hover { background: rgba(255,255,255,0.18); }

        #streamContainer {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .stream-player {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            border: none;
            border-radius: 0;
        }

        .stream-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #000;
        }
        .stream-loading p { color: var(--text-muted); font-size: 0.85rem; }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .container { padding-left: 16px; padding-right: 16px; }
            header { padding: 0 16px; gap: 10px; }
            .matches-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body oncontextmenu="return false">

<header>
    <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchFunc" placeholder="Search teams or matches…" autocomplete="off">
    </div>
</header>

<div class="container">
    <h2 class="page-title">
        <i class="fa-solid fa-volleyball"></i> Live Sports
    </h2>

    <div class="controls">
        <button class="sport-btn active" data-sport="football">⚽ Football</button>
        <button class="sport-btn" data-sport="basketball">🏀 Basketball</button>
        <button class="sport-btn" data-sport="american-football">🏈 American Football</button>
        <button class="sport-btn" data-sport="hockey">🏒 Hockey</button>
        <button class="sport-btn" data-sport="baseball">⚾ Baseball</button>
        <button class="sport-btn" data-sport="motor-sports">🏎️ Motor Sports</button>
        <button class="sport-btn" data-sport="fight">🥊 Fight (UFC, Boxing)</button>
        <button class="sport-btn" data-sport="tennis">🎾 Tennis</button>
        <button class="sport-btn" data-sport="rugby">🏉 Rugby</button>
        <button class="sport-btn" data-sport="golf">⛳ Golf</button>
        <button class="sport-btn" data-sport="billiards">🎱 Billiards</button>
        <button class="sport-btn" data-sport="afl">🏉 AFL</button>
        <button class="sport-btn" data-sport="darts">🎯 Darts</button>
        <button class="sport-btn" data-sport="cricket">🏏 Cricket</button>
        <button class="sport-btn" data-sport="other">🏆 Other</button>
        <button class="sport-btn" id="film-btn">🎬 Film Streaming</button>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading matches…</p>
    </div>

    <div id="matches-container" class="matches-grid"></div>
</div>

<!-- STREAM MODAL -->
<div id="streamModal" class="modal">
    <div class="modal-backdrop" onclick="closeStream()"></div>
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Loading Stream…</div>
            <button class="modal-close" onclick="closeStream()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="streamContainer">
            <div class="stream-loading">
                <div class="spinner"></div>
                <p>Loading stream…</p>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://streamed.st/api';
    let currentSport = 'football';
    let allMatches = [];

    const sportIcons = {
        football:'⚽', basketball:'🏀', 'american-football':'🏈', hockey:'🏒',
        baseball:'⚾', 'motor-sports':'🏎️', fight:'🥊', tennis:'🎾', rugby:'🏉',
        golf:'⛳', billiards:'🎱', afl:'🏉', darts:'🎯', cricket:'🏏', other:'🏆'
    };

    const matchesContainer = document.getElementById('matches-container');
    const loadingEl        = document.getElementById('loading');
    const sportButtons     = document.querySelectorAll('.sport-btn');
    const streamModal      = document.getElementById('streamModal');
    const streamContainer  = document.getElementById('streamContainer');
    const modalTitle       = document.getElementById('modalTitle');
    const searchFunc       = document.getElementById('searchFunc');

    sportButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            sportButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSport = btn.dataset.sport;
            loadMatches(currentSport);
        });
    });

    searchFunc.addEventListener('input', () => {
        filterAndDisplayMatches();
    });

    function closeStream() {
        streamModal.classList.remove('active');
        streamContainer.innerHTML = '<div class="stream-loading"><div class="spinner"></div><p>Loading stream…</p></div>';
    }

    window.addEventListener('click', (event) => {
        if (event.target === streamModal) closeStream();
    });

    function filterAndDisplayMatches() {
        const searchTerm = searchFunc.value.toLowerCase();
        const filteredMatches = allMatches.filter(match => {
            const home = match.teams?.home?.name || '';
            const away = match.teams?.away?.name || '';
            if (home === 'TBA' || away === 'TBA' || !home || !away) return false;
            if (searchTerm) {
                const matchText = `${home} ${away} ${match.title || ''}`.toLowerCase();
                return matchText.includes(searchTerm);
            }
            return true;
        });

        matchesContainer.innerHTML = '';

        if (filteredMatches.length === 0) {
            matchesContainer.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <p>${searchTerm ? 'No matches found' : 'No matches with confirmed teams available'}</p>
                    <p>Try searching for a different team or check back soon</p>
                </div>`;
            return;
        }

        filteredMatches.forEach(match => {
            const card = createMatchCard(match);
            matchesContainer.appendChild(card);
        });
    }

    async function loadMatches(sport) {
        matchesContainer.innerHTML = '';
        loadingEl.style.display = 'block';
        searchFunc.value = '';

        try {
            const response = await fetch(`${API_BASE}/matches/${sport}`);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const matches = await response.json();
            allMatches = matches || [];
            loadingEl.style.display = 'none';
            filterAndDisplayMatches();
        } catch (error) {
            console.error('Error loading matches:', error);
            loadingEl.style.display = 'none';
            matchesContainer.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <p>Error loading matches</p>
                    <p>Please try again later</p>
                </div>`;
        }
    }

    function createMatchCard(match) {
        const card = document.createElement('div');
        card.className = 'match-card';

        const time  = match.date ? new Date(match.date).toLocaleString() : 'Time TBA';
        const home  = match.teams?.home?.name || 'TBA';
        const away  = match.teams?.away?.name || 'TBA';
        const now   = Date.now();
        const mTime = match.date ? new Date(match.date).getTime() : 0;
        const isLive = mTime && now >= mTime && now <= mTime + 3*60*60*1000;
        const hasPoster = !!match.poster;
        const poster    = hasPoster ? `https://streamed.st${match.poster}` : '';
        const icon      = sportIcons[currentSport] || '🏆';

        let streamsHTML = '<div class="no-streams">No streams available</div>';
        if (match.sources && match.sources.length > 0) {
            streamsHTML = '<div class="streams">';
            match.sources.slice(0, 3).forEach((source, idx) => {
                streamsHTML += `
                    <button class="stream-link"
                        onclick="openStream(event, '${home} vs ${away}', '${source.source || ''}', '${source.id || ''}')">
                        <i class="fa-solid fa-play" style="font-size:.65rem;"></i> Server ${idx + 1}
                    </button>`;
            });
            streamsHTML += '</div>';
        }

        card.innerHTML = `
            <div class="match-thumb">
                ${isLive ? '<div class="live-badge">LIVE</div>' : ''}
                ${hasPoster ? `
                    <div class="thumb-spinner"><div class="spinner"></div></div>
                    <img src="${poster}" alt="${home} vs ${away}"
                        onload="this.previousElementSibling.style.display='none';"
                        onerror="this.style.display='none';this.previousElementSibling.style.display='none';this.nextElementSibling.style.display='flex';">
                ` : ''}
                <div class="fake-thumb" style="display:${hasPoster ? 'none' : 'flex'};">
                    <div class="ft-icon">${icon}</div>
                    <div class="team-name">${home}</div>
                    <div class="vs">VS</div>
                    <div class="team-name">${away}</div>
                </div>
            </div>
            <div class="match-content">
                <div class="match-time"><i class="fa-regular fa-clock" style="margin-right:5px;"></i>${time}</div>
                <div class="match-teams">${home} <span style="color:var(--accent-2);font-size:.85rem;">vs</span> ${away}</div>
                ${streamsHTML}
            </div>`;

        return card;
    }

    async function openStream(event, matchTitle, source, sourceId) {
        event.preventDefault();
        streamModal.classList.add('active');
        modalTitle.textContent = `${matchTitle} — ${source}`;

        try {
            const response = await fetch(`${API_BASE}/stream/${source}/${sourceId}`);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const streamData = await response.json();

            let embedUrl = null;
            if (Array.isArray(streamData) && streamData.length > 0) {
                const s = streamData[0];
                embedUrl = s.embedUrl || s.url || s.link || s.embed || s.streamUrl || s.player || s.iframe;
            } else if (typeof streamData === 'object') {
                embedUrl = streamData.embedUrl || streamData.url || streamData.link || streamData.embed || streamData.streamUrl || streamData.player || streamData.iframe;
            }

            if (embedUrl) {
                streamContainer.innerHTML = `
                    <iframe class="stream-player" src="${embedUrl}"
                        frameborder="0" allowfullscreen allow="autoplay; encrypted-media">
                    </iframe>`;
                addFullscreenButton();
            } else {
                streamContainer.innerHTML = `
                    <div class="stream-loading">
                        <p>Stream data found but unable to load. Please try another source.</p>
                    </div>`;
            }
        } catch (error) {
            console.error('Error fetching stream:', error);
            streamContainer.innerHTML = `
                <div class="stream-loading">
                    <p>Unable to load stream</p>
                    <p style="font-size:0.8rem;margin-top:8px;color:rgba(255,255,255,0.3);">Error: ${error.message}</p>
                </div>`;
        }
    }

    /* ── FULLSCREEN ── */
    function addFullscreenButton() {
        const iframe  = document.querySelector('.stream-player');
        const wrapper = iframe?.parentElement;
        const modal   = document.querySelector('.modal-box');
        if (!wrapper || document.getElementById('sportsFSBtn')) return;

        wrapper.style.position = 'relative';

        const btn = document.createElement('button');
        btn.id = 'sportsFSBtn';
        btn.innerHTML = '<i class="fa-solid fa-expand fa-lg"></i>';
        btn.style.cssText = 'position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);color:white;border:none;padding:6px 10px;border-radius:8px;z-index:999999;cursor:pointer;transition:opacity 0.3s;font-size:1.1rem;';
        wrapper.appendChild(btn);

        let fadeTimeout;
        function resetFade() { btn.style.opacity='1'; clearTimeout(fadeTimeout); fadeTimeout=setTimeout(()=>{btn.style.opacity='0.3';},2500); }
        wrapper.addEventListener('mousemove', resetFade);
        wrapper.addEventListener('touchstart', resetFade);
        resetFade();

        let isFS = false, saved = {};
        btn.addEventListener('click', () => {
            const hdr = document.querySelector('header');
            const cont = document.querySelector('.container');
            resetFade();
            if (!isFS) {
                saved = { modalPadding: modal.style.padding, modalRadius: modal.style.borderRadius };
                modal.style.padding = '0'; modal.style.borderRadius = '0';
                wrapper.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;margin:0;padding:0;z-index:999998;background:#000;';
                iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:0;';
                hdr.style.display = 'none'; cont.style.display = 'none';
                document.body.style.overflow = 'hidden';
                btn.innerHTML = '<i class="fa-solid fa-compress fa-lg"></i>';
                if (window.AppInventor) window.AppInventor.setWebViewString('orientation');
                // ── Notify parent (index.html) to hide its header ──
                window.parent.postMessage({ type: 'sportsFullscreen', active: true }, '*');
            } else {
                modal.style.padding = saved.modalPadding; modal.style.borderRadius = saved.modalRadius;
                wrapper.style.cssText = 'position:relative;width:100%;aspect-ratio:16/9;background:#000;';
                iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;';
                hdr.style.display = ''; cont.style.display = '';
                document.body.style.overflow = '';
                btn.innerHTML = '<i class="fa-solid fa-expand fa-lg"></i>';
                if (window.AppInventor) window.AppInventor.setWebViewString('orientations');
                // ── Notify parent (index.html) to restore its header ──
                window.parent.postMessage({ type: 'sportsFullscreen', active: false }, '*');
            }
            isFS = !isFS;
        });
    }

    /* ── AppInventor ── */
    function sendToAppInventor(msg) {
        if (window.AppInventor?.setWebViewString) {
            window.AppInventor.setWebViewString(msg);
        } else {
            setTimeout(() => { if (window.AppInventor?.setWebViewString) window.AppInventor.setWebViewString(msg); }, 300);
        }
    }
    sendToAppInventor('init');

    document.getElementById('film-btn').addEventListener('click', function() {
        if (window.AppInventor?.setWebViewString) {
            window.AppInventor.setWebViewString('Floating_Action_Button1_Click');
        }
    });

    document.getElementById('back-btn')?.addEventListener('click', () => {
        if (document.referrer) window.history.back();
        else window.location.href = 'index.html';
    });

    /* ── INIT ── */
    loadMatches('football');
</script>
