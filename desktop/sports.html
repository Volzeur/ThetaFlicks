<!-- THETAFLICKS WIDGET START -->
<style>
    /* SCOPED STYLES - Only affects #theta-sports-widget */
    #theta-sports-widget {
        --ts-bg-base: #0f1218;
        --ts-bg-card: #1a1e2a;
        --ts-accent: #285761;
        --ts-accent-2: #39cccc;
        --ts-text: #D7D7D7;
        --ts-muted: #39cccc;
        --ts-border: rgba(79, 195, 247, 0.12);
        --ts-radius: 12px;
        
        font-family: 'Lexend', sans-serif;
        background: var(--ts-bg-base);
        color: var(--ts-text);
        width: 100%;
        max-width: 100%;
        position: relative;
        overflow: hidden;
        border-radius: var(--ts-radius);
        border: 1px solid var(--ts-border);
        box-sizing: border-box;
    }

    /* Reset internal elements */
    #theta-sports-widget * { box-sizing: border-box; }
    
    /* Internal Background Gradient */
    #theta-sports-widget::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(79,195,247,0.07) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
    }

    /* Widget Header (Static, not fixed) */
    .ts-header {
        position: relative;
        z-index: 10;
        padding: 16px;
        border-bottom: 1px solid var(--ts-border);
        background: rgba(15, 18, 24, 0.6);
    }

    .ts-search-wrap {
        width: 100%;
        position: relative;
    }

    .ts-search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ts-muted);
        font-size: 0.85rem;
        pointer-events: none;
    }

    #ts-search-input {
        width: 100%;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--ts-border);
        border-radius: 50px;
        color: var(--ts-text);
        font-family: inherit;
        font-size: 0.9rem;
        padding: 10px 20px 10px 40px;
        outline: none;
    }
    #ts-search-input:focus { border-color: var(--ts-accent-2); }

    /* Controls */
    .ts-controls {
        display: flex;
        gap: 8px;
        padding: 16px;
        overflow-x: auto;
        position: relative;
        z-index: 10;
        scrollbar-width: none;
    }
    .ts-controls::-webkit-scrollbar { display: none; }

    .ts-btn {
        padding: 6px 16px;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 600;
        border: 1px solid var(--ts-border);
        background: transparent;
        color: var(--ts-text);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
    }
    .ts-btn:hover { border-color: var(--ts-accent-2); color: var(--ts-accent-2); }
    .ts-btn.active { background: var(--ts-accent); color: #fff; border-color: var(--ts-accent); }

    /* Grid */
    .ts-container {
        padding: 0 16px 16px;
        position: relative;
        z-index: 10;
    }

    .ts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
    }

    /* Card */
    .ts-card {
        background: var(--ts-bg-card);
        border: 1px solid var(--ts-border);
        border-radius: var(--ts-radius);
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .ts-card:hover { border-color: rgba(57, 204, 204, 0.3); }

    .ts-thumb {
        width: 100%;
        aspect-ratio: 16/9;
        background: #151922;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .ts-thumb img {
        width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0;
    }
    .ts-fallback {
        flex-direction: column; gap: 8px; color: var(--ts-muted); text-align: center; padding: 16px;
    }
    .ts-fallback i { font-size: 2rem; margin-bottom: 4px; }
    .ts-fallback span { font-size: 0.85rem; font-weight: 600; color: var(--ts-text); }

    .ts-live {
        position: absolute; top: 8px; left: 8px;
        background: #ef5350; color: #fff;
        font-size: 0.65rem; font-weight: 700;
        padding: 3px 8px; border-radius: 4px;
        z-index: 2; display: flex; align-items: center; gap: 5px;
    }
    .ts-live::before {
        content: ''; width: 5px; height: 5px; background: #fff; border-radius: 50%;
        animation: ts-pulse 1.2s infinite;
    }
    @keyframes ts-pulse { 50% { opacity: 0.4; } }

    .ts-content { padding: 14px; }
    .ts-time { font-size: 0.75rem; color: var(--ts-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .ts-teams { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 14px; line-height: 1.3; }
    
    .ts-streams { display: flex; gap: 8px; flex-wrap: wrap; }
    .ts-stream-btn {
        display: flex; align-items: center; gap: 6px;
        background: var(--ts-accent); color: #fff;
        border: none; border-radius: 6px;
        font-size: 0.75rem; font-weight: 600;
        padding: 6px 12px; cursor: pointer;
    }
    .ts-stream-btn:hover { background: var(--ts-accent-2); color: var(--ts-bg-base); }

    /* States */
    .ts-loading, .ts-empty {
        grid-column: 1 / -1; text-align: center; padding: 40px 20px;
        color: rgba(215, 215, 215, 0.4); font-size: 0.9rem;
    }
    .ts-spinner {
        width: 2rem; height: 2rem;
        border: 3px solid rgba(79,195,247,0.15);
        border-top-color: var(--ts-accent-2);
        border-radius: 50%;
        animation: ts-spin 0.8s linear infinite;
        margin: 0 auto 12px;
    }
    @keyframes ts-spin { to { transform: rotate(360deg); } }

    /* Modal (Scoped to widget but fixed to viewport) */
    #ts-modal {
        display: none;
        position: fixed; inset: 0; z-index: 9999;
        align-items: center; justify-content: center; padding: 20px;
    }
    #ts-modal.active { display: flex; }
    .ts-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
    .ts-modal-box {
        position: relative; z-index: 1;
        background: var(--ts-bg-card);
        border: 1px solid var(--ts-border);
        border-radius: var(--ts-radius);
        width: 100%; max-width: 900px;
        overflow: hidden;
    }
    .ts-modal-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px; border-bottom: 1px solid var(--ts-border);
    }
    .ts-modal-title { font-size: 0.9rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }
    .ts-modal-close {
        width: 28px; height: 28px; background: rgba(255,255,255,0.05);
        border: none; border-radius: 6px; color: var(--ts-text);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .ts-modal-close:hover { background: rgba(255,255,255,0.15); }
    #ts-stream-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .ts-player { width: 100%; height: 100%; border: none; }
</style>

<div id="theta-sports-widget">
    <div class="ts-header">
        <div class="ts-search-wrap">
            <i class="fa-solid fa-magnifying-glass ts-search-icon"></i>
            <input type="text" id="ts-search-input" placeholder="Search teams…" autocomplete="off">
        </div>
    </div>

    <div class="ts-controls" id="ts-controls"></div>

    <div class="ts-container">
        <div id="ts-loading" class="ts-loading" style="display: none;">
            <div class="ts-spinner"></div>
            <p>Loading matches…</p>
        </div>
        <div id="ts-matches" class="ts-grid"></div>
    </div>
</div>

<div id="ts-modal">
    <div class="ts-modal-backdrop" onclick="tsCloseStream()"></div>
    <div class="ts-modal-box">
        <div class="ts-modal-header">
            <span class="ts-modal-title" id="ts-modal-title">Stream</span>
            <button class="ts-modal-close" onclick="tsCloseStream()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="ts-stream-container"></div>
    </div>
</div>

<script>
    (function() {
        const API_BASE = 'https://streamed.st/api';
        let currentSport = 'football';
        let allMatches = [];

        const sportIcons = {
            football: 'fa-solid fa-futbol', basketball: 'fa-solid fa-basketball',
            'american-football': 'fa-solid fa-football', hockey: 'fa-solid fa-hockey-puck',
            baseball: 'fa-solid fa-baseball', 'motor-sports': 'fa-solid fa-flag-checkered',
            fight: 'fa-solid fa-hand-fist', tennis: 'fa-solid fa-table-tennis-paddle-ball',
            rugby: 'fa-solid fa-football', golf: 'fa-solid fa-golf-ball-tee',
            billiards: 'fa-solid fa-bowling-ball', afl: 'fa-solid fa-football',
            darts: 'fa-solid fa-bullseye', cricket: 'fa-solid fa-baseball-bat-ball',
            other: 'fa-solid fa-trophy'
        };

        const sportsList = Object.keys(sportIcons);
        const controlsEl = document.getElementById('ts-controls');
        const matchesContainer = document.getElementById('ts-matches');
        const loadingEl = document.getElementById('ts-loading');
        const searchFunc = document.getElementById('ts-search-input');
        const streamModal = document.getElementById('ts-modal');
        const streamContainer = document.getElementById('ts-stream-container');
        const modalTitle = document.getElementById('ts-modal-title');

        // Generate buttons
        sportsList.forEach(sport => {
            const btn = document.createElement('button');
            btn.className = `ts-btn ${sport === currentSport ? 'active' : ''}`;
            btn.dataset.sport = sport;
            btn.textContent = sport.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
            btn.addEventListener('click', () => {
                document.querySelectorAll('.ts-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSport = sport;
                tsLoadMatches(currentSport);
            });
            controlsEl.appendChild(btn);
        });

        searchFunc.addEventListener('input', tsRenderMatches);

        window.tsCloseStream = function() {
            streamModal.classList.remove('active');
            streamContainer.innerHTML = '';
        }

        function tsRenderMatches() {
            const term = searchFunc.value.toLowerCase();
            const filtered = allMatches.filter(m => {
                const home = m.teams?.home?.name || '';
                const away = m.teams?.away?.name || '';
                if (home === 'TBA' || away === 'TBA' || !home || !away) return false;
                return !term || `${home} ${away} ${m.title || ''}`.toLowerCase().includes(term);
            });

            if (filtered.length === 0) {
                matchesContainer.innerHTML = `<div class="ts-empty"><p>${term ? 'No matches found' : 'No confirmed matches'}</p></div>`;
                return;
            }

            matchesContainer.innerHTML = filtered.map(match => {
                const time = match.date ? new Date(match.date).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Time TBA';
                const home = match.teams?.home?.name || 'TBA';
                const away = match.teams?.away?.name || 'TBA';
                const isLive = match.date && Date.now() >= new Date(match.date).getTime() && Date.now() <= new Date(match.date).getTime() + 3 * 60 * 60 * 1000;
                const hasPoster = !!match.poster;
                const posterUrl = hasPoster ? `https://streamed.st${match.poster}` : '';
                const icon = sportIcons[currentSport] || 'fa-solid fa-trophy';

                let streamsHTML = '<span style="font-size:0.75rem; color:rgba(255,255,255,0.3);">No streams</span>';
                if (match.sources?.length) {
                    streamsHTML = '<div class="ts-streams">' + 
                        match.sources.slice(0, 3).map((src, i) => 
                            `<button class="ts-stream-btn" onclick="tsOpenStream(event, '${home} vs ${away}', '${src.source || 'Source'}', '${src.id || ''}')">
                                <i class="fa-solid fa-play" style="font-size:0.6rem;"></i> Server ${i + 1}
                            </button>`
                        ).join('') + '</div>';
                }

                return `
                    <div class="ts-card">
                        <div class="ts-thumb">
                            ${isLive ? '<span class="ts-live">LIVE</span>' : ''}
                            ${hasPoster ? `<img src="${posterUrl}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" alt="Poster">` : ''}
                            <div class="ts-fallback" style="display: ${hasPoster ? 'none' : 'flex'}">
                                <i class="${icon}"></i>
                                <span>${home} vs ${away}</span>
                            </div>
                        </div>
                        <div class="ts-content">
                            <div class="ts-time"><i class="fa-regular fa-clock"></i> ${time}</div>
                            <div class="ts-teams">${home} <span style="color:var(--ts-accent-2); font-size:0.8rem;">vs</span> ${away}</div>
                            ${streamsHTML}
                        </div>
                    </div>`;
            }).join('');
        }

        async function tsLoadMatches(sport) {
            matchesContainer.innerHTML = '';
            loadingEl.style.display = 'block';
            searchFunc.value = '';
            try {
                const res = await fetch(`${API_BASE}/matches/${sport}`);
                if (!res.ok) throw new Error(res.status);
                allMatches = await res.json() || [];
                loadingEl.style.display = 'none';
                tsRenderMatches();
            } catch (err) {
                console.error('Error:', err);
                loadingEl.style.display = 'none';
                matchesContainer.innerHTML = '<div class="ts-empty"><p>Failed to load matches.</p></div>';
            }
        }

        window.tsOpenStream = async function(e, title, source, sourceId) {
            e.preventDefault();
            streamModal.classList.add('active');
            modalTitle.textContent = `${title} — ${source}`;
            streamContainer.innerHTML = '<div class="ts-loading" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;"><div class="ts-spinner"></div><p>Loading stream…</p></div>';

            try {
                const res = await fetch(`${API_BASE}/stream/${source}/${sourceId}`);
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();
                
                const item = Array.isArray(data) ? data[0] : data;
                const embedUrl = item?.embedUrl || item?.url;

                if (embedUrl) {
                    streamContainer.innerHTML = `<iframe class="ts-player" src="${embedUrl}" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
                } else {
                    streamContainer.innerHTML = '<div class="ts-empty"><p>Unable to load stream.</p></div>';
                }
            } catch (err) {
                streamContainer.innerHTML = `<div class="ts-empty"><p>Stream failed to load</p></div>`;
            }
        }

        // Init
        tsLoadMatches(currentSport);
    })();
</script>
