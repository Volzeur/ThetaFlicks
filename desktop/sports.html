<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThetaFlicks Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #0f1218;
            --bg-card: #1a1e2a;
            --accent: #285761;
            --accent-2: #39cccc;
            --text-primary: #D7D7D7;
            --text-muted: #39cccc;
            --border: rgba(79, 195, 247, 0.12);
            --header-h: 60px;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Lexend', sans-serif;
            overflow-x: hidden;
        }

        /* Preserved Radial Gradient */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(79,195,247,0.07) 0%, transparent 70%),
                        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(79,195,247,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            background: rgba(15, 18, 24, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            height: var(--header-h);
            z-index: 100;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .search-wrap {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        #searchFunc {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            padding: 10px 20px 10px 40px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        #searchFunc:focus {
            border-color: var(--accent-2);
            background: rgba(57, 204, 204, 0.05);
        }
        #searchFunc::placeholder { color: rgba(215, 215, 215, 0.4); }

        /* MAIN */
        .container {
            padding: 20px;
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
            cursor: grab; /* Added for desktop drag feedback */
        }
        .controls::-webkit-scrollbar { display: none; }
        
        /* Added for active drag state */
        .controls.active-drag {
            cursor: grabbing;
            user-select: none;
        }

        .sport-btn {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
            user-select: none; /* Prevents text highlighting while dragging */
        }
        .sport-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
        .sport-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* GRID & CARDS */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.2s, background 0.2s;
        }
        .match-card:hover {
            border-color: rgba(57, 204, 204, 0.3);
            background: #1e2330;
        }

        .match-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #151922;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .thumb-fallback {
            flex-direction: column;
            gap: 8px;
            color: var(--text-muted);
            text-align: center;
            padding: 16px;
        }
        .thumb-fallback i { font-size: 2rem; margin-bottom: 4px; }
        .thumb-fallback span { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }

        .live-badge {
            position: absolute;
            top: 8px; left: 8px;
            background: #ef5350;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-badge::before {
            content: '';
            width: 5px; height: 5px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .match-content { padding: 14px; }

        .match-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-teams {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .streams { display: flex; gap: 8px; flex-wrap: wrap; }

        .stream-link {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .stream-link:hover { background: var(--accent-2); color: var(--bg-base); }

        /* STATES */
        .loading, .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: rgba(215, 215, 215, 0.4);
            font-size: 0.9rem;
        }
        .spinner {
            width: 2rem; height: 2rem;
            border: 3px solid rgba(79,195,247,0.15);
            border-top-color: var(--accent-2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }

        .modal-box {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 12px;
        }
        .modal-close {
            width: 28px; height: 28px;
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.15); }

        #streamContainer {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        .stream-player { width: 100%; height: 100%; border: none; }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            .matches-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchFunc" placeholder="Search teams or matches…" autocomplete="off">
    </div>
</header>

<main class="container">
    <div class="controls" id="controls"></div>
    
    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Loading matches…</p>
    </div>
    
    <div id="matches-container" class="matches-grid"></div>
</main>

<div id="streamModal" class="modal">
    <div class="modal-backdrop" onclick="closeStream()"></div>
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Stream</span>
            <button class="modal-close" onclick="closeStream()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="streamContainer"></div>
    </div>
</div>

<script>
    const API_BASE = 'https://streamed.st/api';
    let currentSport = 'football';
    let allMatches = [];

    const sportIcons = {
        football: 'fa-solid fa-futbol', basketball: 'fa-solid fa-basketball',
        'american-football': 'fa-solid fa-football', hockey: 'fa-solid fa-hockey-puck',
        baseball: 'fa-solid fa-baseball', 'motor-sports': 'fa-solid fa-flag-checkered',
        fight: 'fa-solid fa-hand-fist', tennis: 'fa-solid fa-table-tennis-paddle-ball',
        rugby: 'fa-solid fa-football', golf: 'fa-solid fa-golf-ball-tee',
        billiards: 'fa-solid fa-bowling-ball', afl: 'fa-solid fa-football',
        darts: 'fa-solid fa-bullseye', cricket: 'fa-solid fa-baseball-bat-ball',
        other: 'fa-solid fa-trophy'
    };

    const sportsList = Object.keys(sportIcons);
    const controlsEl = document.getElementById('controls');
    const matchesContainer = document.getElementById('matches-container');
    const loadingEl = document.getElementById('loading');
    const searchFunc = document.getElementById('searchFunc');
    const streamModal = document.getElementById('streamModal');
    const streamContainer = document.getElementById('streamContainer');
    const modalTitle = document.getElementById('modalTitle');

    // --- DESKTOP NAVIGATION: Mouse Wheel Horizontal Scroll ---
    controlsEl.addEventListener('wheel', (evt) => {
        if (evt.deltaY !== 0) {
            evt.preventDefault();
            controlsEl.scrollLeft += evt.deltaY;
        }
    }, { passive: false });

    // --- DESKTOP NAVIGATION: Click and Drag to Scroll ---
    let isDown = false;
    let startX;
    let scrollLeft;
    let isDragging = false;

    controlsEl.addEventListener('mousedown', (e) => {
        isDown = true;
        isDragging = false;
        controlsEl.classList.add('active-drag');
        startX = e.pageX - controlsEl.offsetLeft;
        scrollLeft = controlsEl.scrollLeft;
    });

    controlsEl.addEventListener('mouseleave', () => {
        isDown = false;
        controlsEl.classList.remove('active-drag');
    });

    controlsEl.addEventListener('mouseup', () => {
        isDown = false;
        controlsEl.classList.remove('active-drag');
    });

    controlsEl.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - controlsEl.offsetLeft;
        const walk = (x - startX) * 2; // Scroll speed multiplier
        
        if (Math.abs(walk) > 5) {
            isDragging = true;
        }
        controlsEl.scrollLeft = scrollLeft - walk;
    });

    // Generate sport buttons dynamically
    sportsList.forEach(sport => {
        const btn = document.createElement('button');
        btn.className = `sport-btn ${sport === currentSport ? 'active' : ''}`;
        btn.dataset.sport = sport;
        btn.textContent = sport.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
        
        btn.addEventListener('click', (e) => {
            // Prevent click from firing if the user was dragging the container
            if (isDragging) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSport = sport;
            loadMatches(currentSport);
        });
        controlsEl.appendChild(btn);
    });

    searchFunc.addEventListener('input', renderMatches);

    function closeStream() {
        streamModal.classList.remove('active');
        streamContainer.innerHTML = '';
    }

    function renderMatches() {
        const term = searchFunc.value.toLowerCase();
        const filtered = allMatches.filter(m => {
            const home = m.teams?.home?.name || '';
            const away = m.teams?.away?.name || '';
            if (home === 'TBA' || away === 'TBA' || !home || !away) return false;
            return !term || `${home} ${away} ${m.title || ''}`.toLowerCase().includes(term);
        });

        if (filtered.length === 0) {
            matchesContainer.innerHTML = `<div class="empty-state"><p>${term ? 'No matches found' : 'No confirmed matches available'}</p></div>`;
            return;
        }

        matchesContainer.innerHTML = filtered.map(match => {
            const time = match.date ? new Date(match.date).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Time TBA';
            const home = match.teams?.home?.name || 'TBA';
            const away = match.teams?.away?.name || 'TBA';
            const isLive = match.date && Date.now() >= new Date(match.date).getTime() && Date.now() <= new Date(match.date).getTime() + 3 * 60 * 60 * 1000;
            const hasPoster = !!match.poster;
            const posterUrl = hasPoster ? `https://streamed.st${match.poster}` : '';
            const icon = sportIcons[currentSport] || 'fa-solid fa-trophy';

            let streamsHTML = '<span style="font-size:0.75rem; color:rgba(255,255,255,0.3);">No streams</span>';
            if (match.sources?.length) {
                streamsHTML = '<div class="streams">' + 
                    match.sources.slice(0, 3).map((src, i) => 
                        `<button class="stream-link" onclick="openStream(event, '${home} vs ${away}', '${src.source || 'Source'}', '${src.id || ''}')">
                            <i class="fa-solid fa-play" style="font-size:0.6rem;"></i> Server ${i + 1}
                        </button>`
                    ).join('') + '</div>';
            }

            return `
                <div class="match-card">
                    <div class="match-thumb">
                        ${isLive ? '<span class="live-badge">LIVE</span>' : ''}
                        ${hasPoster ? `<img src="${posterUrl}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" alt="Poster">` : ''}
                        <div class="thumb-fallback" style="display: ${hasPoster ? 'none' : 'flex'}">
                            <i class="${icon}"></i>
                            <span>${home} vs ${away}</span>
                        </div>
                    </div>
                    <div class="match-content">
                        <div class="match-time"><i class="fa-regular fa-clock"></i> ${time}</div>
                        <div class="match-teams">${home} <span style="color:var(--accent-2); font-size:0.8rem;">vs</span> ${away}</div>
                        ${streamsHTML}
                    </div>
                </div>`;
        }).join('');
    }

    async function loadMatches(sport) {
        matchesContainer.innerHTML = '';
        loadingEl.style.display = 'block';
        searchFunc.value = '';
        try {
            const res = await fetch(`${API_BASE}/matches/${sport}`);
            if (!res.ok) throw new Error(res.status);
            allMatches = await res.json() || [];
            loadingEl.style.display = 'none';
            renderMatches();
        } catch (err) {
            console.error('Error:', err);
            loadingEl.style.display = 'none';
            matchesContainer.innerHTML = '<div class="empty-state"><p>Failed to load matches. Please try again later.</p></div>';
        }
    }

    async function openStream(e, title, source, sourceId) {
        e.preventDefault();
        streamModal.classList.add('active');
        modalTitle.textContent = `${title} — ${source}`;
        streamContainer.innerHTML = '<div class="loading" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;"><div class="spinner"></div><p>Loading stream…</p></div>';

        try {
            const res = await fetch(`${API_BASE}/stream/${source}/${sourceId}`);
            if (!res.ok) throw new Error(res.status);
            const data = await res.json();
            
            const item = Array.isArray(data) ? data[0] : data;
            const embedUrl = item?.embedUrl || item?.url;

            if (embedUrl) {
                streamContainer.innerHTML = `<iframe class="stream-player" src="${embedUrl}" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
            } else {
                streamContainer.innerHTML = '<div class="empty-state"><p>Unable to load stream. Try another server.</p></div>';
            }
        } catch (err) {
            streamContainer.innerHTML = `<div class="empty-state"><p>Stream failed to load</p><p style="font-size:0.8rem; margin-top:8px; opacity:0.5;">${err.message}</p></div>`;
        }
    }

    // Initialize
    loadMatches(currentSport);
</script>
</body>
</html>
